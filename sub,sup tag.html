<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sub/sup script tag</title>
</head>

<body>
    <p>
        (a+b)2=a2+b2+2ab
    </p>
    <!--A sup ke liye tha phele aise tha fir "sup tag" lagane se change hogaya -->
    <!--for sup tag (for hole squre)-->
    <p>
        (a+b)<sup>2</sup>=a<sup>2</sup>+b<sup>2</sup>+2ab
    </p>
<hr>
    <p>
        (a+b)2=a2+b2+2ab
    </p>
    <!--A sub tag ke liye tha phele aise tha fir "sub tag" lagane se change hogaya -->
    <!--for sub tag (iske niche aa jata hai)-->
    <p>
        (a+b)<sub>2</sub>=a<sub>2</sub>+b<sub>2</sub>+2ab
    </p>
</body>
</html>
